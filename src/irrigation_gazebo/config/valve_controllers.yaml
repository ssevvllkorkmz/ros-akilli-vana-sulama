# Her parsel namespace'i içinde yüklenir. Eklem adı launch'ta ${parcel}_valve_joint olarak ezilir.
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 20

valve_position_controller:
  type: effort_controllers/JointPositionController
  joint: valve_joint
  pid: {p: 40.0, i: 0.5, d: 2.0, i_clamp: 5.0}
